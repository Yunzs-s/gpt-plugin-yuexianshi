name: Test and publish Windows quota widget

on:
  push:
    branches: [main]
    paths:
      - gpt-niang-usage/package.json
      - gpt-niang-usage/.codex-plugin/plugin.json
      - gpt-niang-usage/assets/quotes.json
      - gpt-niang-usage/assets/quote-layouts.json
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/**
      - script/**
      - macos/**
      - gpt-niang-usage/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Node runtime tests
        working-directory: gpt-niang-usage
        run: npm test
      - name: Prepare isolated installer executable fixture
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP 'gpt-niang-test-bin'
          New-Item -ItemType Directory -Path $fixture -Force | Out-Null
          Copy-Item (Get-Command node.exe).Source (Join-Path $fixture 'codex.exe')
          $fixture | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Windows installer, lifecycle and WPF tests
        working-directory: gpt-niang-usage
        run: npm run test:windows
      - name: Build and verify Windows bundle
        run: python scripts/build-release.py
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            dist/*-windows.zip
            dist/SHA256SUMS.txt
            dist/release-notes.md
          if-no-files-found: error
  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Verify Windows package and prepare checksums and release notes
        run: python scripts/prepare-release.py
      - name: Publish Windows package together
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(python -c 'import json; print(json.load(open("gpt-niang-usage/package.json"))["version"])')"
          tag="v$version"
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName > "$RUNNER_TEMP/releases.json"
          if jq -e --arg tag "$tag" '.[] | select(.tagName == $tag)' "$RUNNER_TEMP/releases.json" >/dev/null; then
            latest="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
            test "$latest" = "$tag" || { echo "Only the latest release may receive a quote refresh." >&2; exit 1; }
            git fetch --no-tags origin "refs/tags/$tag:refs/tags/$tag"
            if git diff --quiet "$tag" "$GITHUB_SHA" -- gpt-niang-usage/assets/quotes.json; then
              echo "Release $tag already exists without a quote update; increment the version first." >&2
              exit 1
            fi
            current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
            test "$current" = "$GITHUB_SHA" || { echo "Main changed during the build; refusing to replace newer assets." >&2; exit 1; }
            gh release upload "$tag" dist/*-windows.zip dist/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" -f sha="$GITHUB_SHA" -F force=true
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes-file dist/release-notes.md --latest
            exit 0
          fi
          gh release create "$tag" dist/*-windows.zip dist/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$tag · Windows 11" --notes-file dist/release-notes.md --draft
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest
